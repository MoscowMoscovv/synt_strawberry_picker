[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strawberry-picker"
version = "0.1.0"
description = "Procedural MuJoCo strawberry plant generator"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "mujoco>=3.2",
    "pytest>=7.0",
]